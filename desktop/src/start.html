<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Yellowcode</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/skin/vars.css">
<style>
:root { color-scheme: light; font: var(--cfg-font-size) var(--cfg-font-ui); color: var(--cfg-text); background: var(--cfg-surface-chrome); }
* { box-sizing: border-box; }
body { margin: 0; padding: 14px; }
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
button { min-height: 24px; border: 1px solid var(--cfg-border-control); border-radius: var(--cfg-radius); background: var(--cfg-button-bg); padding: 3px 12px; cursor: pointer; }
button:disabled { color: var(--cfg-text-disabled); cursor: default; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 1px dotted var(--cfg-selection-focus-border); outline-offset: 2px; }
button:hover:enabled { border-color: var(--cfg-selection-focus-border); }
#launcher { height: calc(100vh - 28px); display: grid; grid-template-columns: minmax(200px, 1fr) 140px; gap: 16px; }
#sources { min-height: 0; display: flex; flex-direction: column; }
#sources > label { margin-bottom: 5px; }
#recent { flex: 1; overflow: auto; background: var(--cfg-surface-field); border: 1px solid var(--cfg-border-control); padding: 0; margin: 0; list-style: none; }
#recent li { padding: 6px 8px; color: var(--cfg-text-field); cursor: default; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#recent li[aria-selected="true"] { background: var(--cfg-selection-bg); color: var(--cfg-text-selected); }
#recent li.missing { color: var(--cfg-text-disabled-field); }
#source-path { height: 26px; padding-top: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#actions { display: flex; flex-direction: column; gap: 8px; padding-top: 18px; }
#add { margin-top: 24px; }
#setup { margin-top: 8px; }
#quit { margin-top: auto; }
dialog { padding: 0; color: var(--cfg-text); border: 1px solid var(--cfg-border-mdi); background: var(--cfg-surface-chrome); box-shadow: 2px 3px 9px var(--cfg-shadow); width: 448px; max-width: calc(100vw - 24px); }
dialog::backdrop { background: #00000018; }
.caption { background: var(--cfg-caption-active-bg); color: var(--cfg-caption-text); padding: 7px 10px; font-size: 13px; margin: 0; }
.content { padding: 18px 14px; }
#wizard .content { min-height: 180px; }
.field { display: block; margin: 0 0 20px; }
.field input { display: block; width: 100%; margin-top: 6px; min-height: 23px; }
input[type="text"], select { border: 1px solid var(--cfg-border-control); background: var(--cfg-surface-field); color: var(--cfg-text-field); padding: 3px; }
.path-row { display: flex; gap: 4px; margin-top: 6px; }
.path-row input { flex: 1; min-width: 0; margin: 0; }
.footer { display: flex; justify-content: flex-end; gap: 6px; padding: 8px 12px 12px; }
#error-text { white-space: pre-wrap; overflow-wrap: anywhere; }
#settings .field { margin-bottom: 12px; }
#settings button { margin: 4px 0; }
#splash { position: fixed; inset: 0; background: var(--cfg-surface-form); display: flex; flex-direction: column; }
#splash-art { width: 100%; height: 150px; object-fit: cover; object-position: top left; }
#splash-footer { position: absolute; bottom: 0; width: 100%; height: 48px; padding: 7px 28px; border-top: 1px solid var(--cfg-border-list); background: var(--cfg-surface-chrome); }
#splash-product { font-size: 14px; margin-bottom: 3px; }
#splash h1 { font-size: 26px; font-weight: normal; margin: 12px 28px; }
#loading-path, #stage { margin: 4px 28px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
#loading-controls { display: flex; align-items: center; gap: 14px; margin: 12px 28px; z-index: 1; }
#progress { width: 241px; height: 19px; border: 1px solid var(--cfg-border-control); padding: 1px; background: url('/startup/progress-border.png') center/100% 100%; }
#progress-fill { height: 15px; width: 0; background: url('/startup/progress-bar.png') left center/115px 15px repeat-x; }
:root { color: #555; background: #fff; font: 14px Arial, sans-serif; }
body { padding: 14px 8px 8px 14px; }
button { border-color: #d0d0d0; border-radius: 1px; background: linear-gradient(#fff, #f0f0f0); min-height: 24px; padding: 2px 8px; }
button:disabled { color: #aaa; }
input[type=checkbox] { accent-color: #00a651; }
#launcher { height: 341px; grid-template-columns: minmax(200px, 1fr) 140px; gap: 16px; }
#sources > label { color: #00a651; margin-bottom: 2px; }
#recent { border-color: #d5d5d5; background: white; }
#recent li { height: 29px; padding: 5px 8px; color: #555; }
#recent li[aria-selected=true] { background: #fde68f; color: #555; box-shadow: inset 0 0 0 2px #f5c400; }
#source-path { height: 32px; padding-top: 8px; }
#actions { padding-top: 18px; gap: 8px; }
#add { margin-top: 38px; }
#setup { margin-top: 8px; }
#follow-link { white-space: nowrap; padding: 0; border: 0; background: transparent; text-decoration: underline; margin-top: 10px; color: #555; }
#quit { margin-top: auto; }
dialog { color: #555; background: white; border-color: #b5b5b5; max-height: calc(100vh - 16px); }
dialog::backdrop { background: transparent; }
.caption { background: white; color: #111; font-size: 18px; font-weight: normal; padding: 10px 12px; display: flex; justify-content: space-between; }
.caption button { padding: 0; width: 20px; border: 0; background: transparent; font-size: 20px; }
#wizard { width: 448px; height: 464px; }
#wizard .content { padding: 8px; }
#wizard .footer { position: absolute; bottom: 0; right: 0; }
.footer { padding: 8px; gap: 8px; }
.footer button { min-width: 80px; height: 25px; }
input[type=text], select { border-color: #b5b5b5; background: white; color: #555; }
#launch-settings { width: 524px; }
#launch-settings .content { padding: 4px 8px; }
#launch-settings label { display: block; line-height: 22px; }
#launch-settings input[type=checkbox] { margin: 0 4px 0 0; vertical-align: middle; }
#launch-settings input[type=number] { width: 72px; margin-left: 12px; }
.setup-section { margin-top: 8px; }
.setup-toolbar { height: 28px; display: flex; gap: 4px; align-items: center; }
.setup-toolbar button { border: 0; background: transparent; padding: 0; min-width: 22px; }
.setup-empty { height: 66px; border: 1px solid #d5d5d5; }
.setup-versions { height: 94px; border: 1px solid #d5d5d5; margin-bottom: 4px; }
.setup-versions table { border-collapse: collapse; width: 100%; }
.setup-versions th { font-weight: normal; background: #f2f2f2; text-align: left; border: 1px solid #ddd; padding: 6px; }
.setup-link { border: 0; background: transparent; text-decoration: underline; padding: 0; }
#skin-settings-open { margin-right: auto; }
#launcher { height: calc(100vh - 28px); min-height: 380px; grid-template-columns: 164px minmax(0, 1fr) 158px; gap: 16px; }
#source-nav { display: flex; flex-direction: column; gap: 6px; padding-right: 12px; border-right: 1px solid #ddd; }
#source-nav .brand { color: #333; font-size: 19px; margin: 0 0 18px; }
#source-nav button { text-align: left; padding: 9px 8px; border: 1px solid transparent; background: transparent; white-space: normal; }
#source-nav button[aria-selected=true] { background: #fff2b9; border-color: #e8c54c; }
#sources > label { color: #333; font-size: 18px; margin-bottom: 12px; }
#source-search { width: 100%; padding: 7px; margin-bottom: 10px; }
#recent li { height: auto; min-height: 56px; padding: 8px; }
.source-name { display: block; font-weight: bold; }
.source-meta { display: block; font-size: 12px; color: #666; margin-top: 4px; }
#source-path { height: auto; min-height: 34px; font-size: 12px; overflow-wrap: anywhere; white-space: normal; }
#source-mode, #source-empty { font-size: 12px; line-height: 1.5; margin: 8px 0; }
#source-empty { padding: 14px; border: 1px solid #ddd; }
#actions { padding-top: 36px; }
#add { margin-top: 20px; }
#enterprise, #follow-link { display: none; }
#source-origin { display: block; width: 100%; margin-top: 6px; }
#wizard { height: 490px; }
@media (max-width: 640px) {
  #launcher { grid-template-columns: 136px minmax(0, 1fr); }
  #actions { grid-column: 2; padding: 0; flex-direction: row; flex-wrap: wrap; gap: 5px; }
  #actions button { margin: 0; } #quit { margin-left: auto; }
}
</style>
</head>
<body>
<main id="launcher">
<nav id="source-nav" role="tablist" aria-orientation="vertical" aria-label="Источники"><strong class="brand">Yellowcode</strong><button id="nav-recent" role="tab" aria-selected="true" aria-controls="sources" data-section="recent"></button><button id="nav-onec" role="tab" aria-selected="false" aria-controls="sources" data-section="onec" tabindex="-1"></button><button id="nav-yellowcode" role="tab" aria-selected="false" aria-controls="sources" data-section="yellowcode" tabindex="-1"></button><button id="nav-files" role="tab" aria-selected="false" aria-controls="sources" data-section="files" tabindex="-1"></button></nav>
<section id="sources" role="tabpanel" aria-labelledby="nav-recent"><label id="list-title" for="recent"></label><input id="source-search" type="search"><p id="source-empty" hidden></p><ul id="recent" role="listbox" tabindex="0" aria-labelledby="list-title"></ul><div id="source-path"></div><div id="source-mode" role="status"></div></section>
<aside id="actions"><button id="enterprise" disabled></button><button id="open" disabled></button><button id="add"></button><button id="edit" disabled></button><button id="remove" disabled></button><button id="setup"></button><button id="follow-link" disabled></button><button id="quit"></button></aside>
</main>
<dialog id="wizard" aria-labelledby="wizard-title"><h2 class="caption"><span id="wizard-title"></span><button id="wizard-close" type="button" aria-label="Close">×</button></h2><div class="content"><label class="field"><span id="name-label"></span><input id="source-name" type="text" maxlength="256"></label><div class="field"><label id="path-label" for="source-input"></label><span class="path-row"><input id="source-input" type="text"><button id="pick-file" type="button"></button><button id="pick-folder" type="button"></button></span></div><label class="field"><span id="origin-label"></span><select id="source-origin"><option value="one_c" id="origin-onec"></option><option value="yellowcode" id="origin-yellowcode"></option></select></label><p id="source-hint"></p></div><div class="footer"><button id="finish"></button><button id="wizard-cancel"></button></div></dialog>
<dialog id="launch-settings" aria-labelledby="launch-settings-title"><h2 class="caption"><span id="launch-settings-title"></span><button data-launch-close aria-label="Close">×</button></h2><div class="content" id="launch-settings-content"></div><div class="footer"><button id="skin-settings-open"></button><button data-launch-close>OK</button><button data-launch-close id="launch-settings-cancel"></button></div></dialog>
<dialog id="settings" aria-labelledby="settings-title"><h2 class="caption" id="settings-title"></h2><div class="content"><label class="field"><span id="skin-label"></span> <select id="skins"></select></label><button id="skin-file"></button><button id="skin-folder"></button></div><div class="footer"><button id="settings-close"></button></div></dialog>
<dialog id="error" aria-labelledby="error-title"><h2 class="caption" id="error-title">Yellowcode</h2><div class="content" id="error-text"></div><div class="footer"><button id="error-close">OK</button></div></dialog>
<dialog id="confirm" aria-labelledby="confirm-title"><h2 class="caption" id="confirm-title">Yellowcode</h2><div class="content" id="confirm-text"></div><div class="footer"><button id="confirm-ok"></button><button id="confirm-cancel"></button></div></dialog>
<section id="splash" hidden><img id="splash-art" src="/skin/icon/pic/splash" alt=""><h1 id="splash-title"></h1><div id="loading-path"></div><div id="stage" role="status"></div><div id="loading-controls"><div id="progress" role="progressbar" aria-valuemin="0" aria-valuemax="4"><div id="progress-fill"></div></div><button id="cancel"></button></div><footer id="splash-footer"><div id="splash-product">Yellowcode <span id="app-version"></span></div><div id="splash-description"></div></footer></section>
<script src="/start.js"></script>
</body>
</html>
