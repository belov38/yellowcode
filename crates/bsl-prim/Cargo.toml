[package]
name = "bsl-prim"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
autotests = false
autoexamples = false
autobenches = false

[features]
default = ["icu"]
icu = ["dep:icu46-sys"]

[dependencies]
icu46-sys = { path = "../icu46-sys", optional = true }

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "warn"
unused_result_ok = "warn"
