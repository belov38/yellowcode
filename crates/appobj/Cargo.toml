[package]
name = "appobj"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
publish = false
autotests = false
autoexamples = false
autobenches = false

[dependencies]
sha2 = "0.10"
quick-xml = "0.37"
rand = "0.9"
thiserror = "2"
brace = { path = "../brace" }
bsl-compiler = { path = "../bsl-compiler" }
bsl-prim = { path = "../bsl-prim", default-features = false, features = ["icu"] }
bsl-stdlib = { path = "../bsl-stdlib" }
bsl-syntax = { path = "../bsl-syntax" }
bsl-vm = { path = "../bsl-vm" }
evlog = { path = "../evlog" }
ibschema = { path = "../ibschema" }
md-model = { path = "../md-model" }
platform-catalog = { path = "../platform-catalog" }
query-exec = { path = "../query-exec" }
query-ir = { path = "../query-ir" }

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "warn"
unused_result_ok = "warn"
