[package]
name = "dtfile"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
autotests = false
autoexamples = false
autobenches = false

[dependencies]
thiserror = "2"
zraw = { path = "../zraw" }
brace = { path = "../brace" }
ibschema = { path = "../ibschema" }
onecd = { path = "../onecd", default-features = false }

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "warn"
unused_result_ok = "warn"
