[package]
name = "bsl-stdlib"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
autotests = false
autoexamples = false
autobenches = false

[dependencies]
rand = "0.9"
bsl-vm = { path = "../bsl-vm" }
bsl-prim = { path = "../bsl-prim", default-features = false }
platform-catalog = { path = "../platform-catalog" }
bsl-lib = { path = "../bsl-lib" }
bsl-intl = { path = "../bsl-intl" }
brace = { path = "../brace" }
zraw = { path = "../zraw" }

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "warn"
unused_result_ok = "warn"
