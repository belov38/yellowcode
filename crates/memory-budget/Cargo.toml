[package]
name = "memory-budget"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
autotests = false
autoexamples = false
autobenches = false

[dependencies]
libc = "0.2"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "warn"
unused_result_ok = "warn"

[[bin]]
name = "sealed-heap-probe"
path = "tests/support/sealed_heap_probe.rs"
test = false
bench = false
