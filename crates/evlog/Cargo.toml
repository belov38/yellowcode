[package]
name = "evlog"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
autotests = false
autoexamples = false
autobenches = false

[features]
testdata = []

[dependencies]
thiserror = "2"
rand = "0.9"
serde_json = "1"
brace = { path = "../brace" }
bsl-prim = { path = "../bsl-prim", default-features = false }

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "warn"
unused_result_ok = "warn"
