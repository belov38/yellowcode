[package]
name = "bsl-intl"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
autotests = false
autoexamples = false
autobenches = false

[dependencies]
serde_json = "1"
base64 = "0.22"
bsl-prim = { path = "../bsl-prim", default-features = false }
serde = { version = "1", features = ["derive"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
jiff = { version = "0.2", default-features = false, features = ["alloc"] }

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "warn"
unused_result_ok = "warn"
