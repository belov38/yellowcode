[package]
name = "md-forms"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
publish = false
autotests = false
autoexamples = false
autobenches = false

[features]
testing = ["md-model/testing"]

[dependencies]
base64 = "0.22"
regex = "1"
thiserror = "2"
mdconf-core = { path = "../mdconf-core" }
md-graphics = { path = "../md-graphics" }
md-model = { path = "../md-model" }
mdschema = { path = "../mdschema" }
brace = { path = "../brace" }
memory-budget = { path = "../memory-budget" }

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "warn"
unused_result_ok = "warn"
