[package]
name = "onecd"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
autotests = false
autoexamples = false
autobenches = false

[features]
default = ["icu"]
icu = ["dep:icu46-sys", "icu46-sys/managed"]
testing = []

[dependencies]
thiserror = "2"
memory-budget = { path = "../memory-budget" }
icu46-sys = { path = "../icu46-sys", optional = true }

[target."cfg(unix)".dependencies]
rustix = { version = "1", features = ["fs"] }

[target."cfg(target_os = \"linux\")".dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "warn"
unused_result_ok = "warn"
