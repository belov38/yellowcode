[package]
name = "query-testhost"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
publish = false
autotests = false
autoexamples = false
autobenches = false

[dependencies]
serde_json = "1"
bsl-compiler = { path = "../bsl-compiler" }
query = { path = "../query" }
bsl-vm = { path = "../bsl-vm" }
bsl-stdlib = { path = "../bsl-stdlib" }
bsl-testhost = { path = "../bsl-testhost" }
memory-budget = { path = "../memory-budget" }
query-exec = { path = "../query-exec" }
query-ir = { path = "../query-ir" }
query-syntax = { path = "../query-syntax" }
query-testkit = { path = "../query-testkit" }
infobase = { path = "../infobase" }
ibschema = { path = "../ibschema", features = ["testing"] }
onecd = { path = "../onecd" }
bsl-prim = { path = "../bsl-prim" }
md-model = { path = "../md-model" }
brace = { path = "../brace" }
platform-catalog = { path = "../platform-catalog" }
toml = { version = "0.9", features = ["preserve_order"] }

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "warn"
unused_result_ok = "warn"
