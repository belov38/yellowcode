[package]
name = "bsl-vm"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
autotests = false
autoexamples = false
autobenches = false

[dependencies]
bsl-prim = { path = "../bsl-prim", default-features = false }
platform-catalog = { path = "../platform-catalog" }
bsl-compiler = { path = "../bsl-compiler" }
bsl-syntax = { path = "../bsl-syntax" }
brace = { path = "../brace" }

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "warn"
unused_result_ok = "warn"
