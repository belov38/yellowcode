[package]
name = "query-exec"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
publish = false
autotests = false
autoexamples = false
autobenches = false

[dependencies]
query-ir = { path = "../query-ir" }
query-syntax = { path = "../query-syntax" }
ibschema = { path = "../ibschema" }
bsl-prim = { path = "../bsl-prim" }
memory-budget = { path = "../memory-budget" }
icu46-sys = { path = "../icu46-sys", features = ["managed"] }
platform-catalog = { path = "../platform-catalog" }

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "warn"
unused_result_ok = "warn"
