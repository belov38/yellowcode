[package]
name = "v8cont"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
autotests = false
autoexamples = false
autobenches = false

[features]
testing = []

[dependencies]
thiserror = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
zraw = { path = "../zraw" }
memory-budget = { path = "../memory-budget" }

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "warn"
unused_result_ok = "warn"
