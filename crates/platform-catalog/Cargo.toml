[package]
name = "platform-catalog"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
autotests = false
autoexamples = false
autobenches = false

[dependencies]
bsl-prim = { path = "../bsl-prim", default-features = false }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
memory-budget = { path = "../memory-budget" }
zraw = { path = "../zraw" }

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "warn"
unused_result_ok = "warn"
