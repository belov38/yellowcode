[package]
name = "query-testkit"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
publish = false
autotests = false
autoexamples = false
autobenches = false

[dependencies]
memory-budget = { path = "../memory-budget" }
query-ir = { path = "../query-ir" }
query-syntax = { path = "../query-syntax" }
platform-catalog = { path = "../platform-catalog" }
bsl-prim = { path = "../bsl-prim" }
md-model = { path = "../md-model" }
mdschema = { path = "../mdschema" }
brace = { path = "../brace" }
ibschema = { path = "../ibschema" }
infobase = { path = "../infobase" }

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "warn"
unused_result_ok = "warn"
