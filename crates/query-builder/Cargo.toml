[package]
name = "query-builder"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
publish = false
autotests = false
autoexamples = false
autobenches = false

[dependencies]
query-syntax = { path = "../query-syntax" }
bsl-prim = { path = "../bsl-prim" }
query-ir = { path = "../query-ir" }
platform-catalog = { path = "../platform-catalog" }
mdschema = { path = "../mdschema" }
serde = { version = "1", features = ["derive"] }

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "warn"
unused_result_ok = "warn"
