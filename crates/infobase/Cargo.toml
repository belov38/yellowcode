[package]
name = "infobase"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
autotests = false
autoexamples = false
autobenches = false

[features]
calibration = []

[dependencies]
thiserror = "2"
rand = "0.9"
serde_json = "1"
self_cell = "1"
base64 = "0.22"
md-5 = "0.10"
sha2 = "0.10"
tempfile = "3"
memory-budget = { path = "../memory-budget" }
dtfile = { path = "../dtfile" }
ibschema = { path = "../ibschema" }
onecd = { path = "../onecd" }
zraw = { path = "../zraw" }
brace = { path = "../brace" }
mdconf = { path = "../mdconf" }
v8cont = { path = "../v8cont" }
serde = { version = "1", features = ["derive"] }

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "warn"
unused_result_ok = "warn"
