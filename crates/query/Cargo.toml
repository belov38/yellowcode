[package]
name = "query"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
publish = false
autotests = false
autoexamples = false
autobenches = false

[dependencies]
bsl-vm = { path = "../bsl-vm" }
bsl-stdlib = { path = "../bsl-stdlib" }
bsl-prim = { path = "../bsl-prim" }
query-exec = { path = "../query-exec" }
query-ir = { path = "../query-ir" }
query-syntax = { path = "../query-syntax" }
ibschema = { path = "../ibschema" }
platform-catalog = { path = "../platform-catalog" }

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "warn"
unused_result_ok = "warn"
