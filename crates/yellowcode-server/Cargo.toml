[package]
name = "yellowcode-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
publish = false
autotests = false
autoexamples = false
autobenches = false

[dependencies]
rand = "0.9"
thiserror = "2"
platform-catalog = { path = "../platform-catalog" }
bsl-lib = { path = "../bsl-lib" }
bsl-stdlib = { path = "../bsl-stdlib" }
md-model = { path = "../md-model" }
yellowcode-core = { path = "../yellowcode-core" }
query-console = { path = "../query-console" }
appobj = { path = "../appobj" }
bsl-vm = { path = "../bsl-vm" }
query-exec = { path = "../query-exec" }
query-ir = { path = "../query-ir" }
evlog = { path = "../evlog" }
v8users = { path = "../v8users" }
onecd = { path = "../onecd", default-features = false }
ibschema = { path = "../ibschema" }
icu46-sys = { path = "../icu46-sys" }

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "warn"
unused_result_ok = "warn"
