[package]
name = "yellowcode-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
publish = false
autotests = false
autoexamples = false
autobenches = false

[dependencies]
yellowcode-core = { path = "../yellowcode-core" }
query-console = { path = "../query-console" }
appobj = { path = "../appobj" }
bsl-vm = { path = "../bsl-vm" }
query-exec = { path = "../query-exec" }
query-ir = { path = "../query-ir" }
evlog = { path = "../evlog" }

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "warn"
unused_result_ok = "warn"
