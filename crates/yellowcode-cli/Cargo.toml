[package]
name = "yellowcode-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
publish = false
autotests = false
autoexamples = false
autobenches = false

[dependencies]
yellowcode-core = { path = "../yellowcode-core", features = ["clap"] }
yellowcode-http = { path = "../yellowcode-http" }
clap = { version = "4", features = ["derive"] }
memory-budget = { path = "../memory-budget" }

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "warn"
unused_result_ok = "warn"

[[bin]]
name = "yellowcode"
path = "src/main.rs"
